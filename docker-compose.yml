version: '3.8'

services:
  web-dev:
    build: .
    ports:
      - "9001:80"
    restart: always
    
  web-prod:
    build: .
    ports:
      - "9002:80"
    restart: always

  my-db:
    image: postgres:alpine
    environment:
      POSTGRES_PASSWORD: mypassword
     Volumes:    
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: أننا لم نضع ports لـ Postgres لأننا نريد حمايتها داخل الشبكة فقط
